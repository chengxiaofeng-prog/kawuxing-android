name: Build Android APK

# ── 维护笔记（2026-10-14 那次失败的原因）──────────────────────────────
# 上一版用的是第三方 Action `ArtemSBulgakov/buildozer-action@v1`，它自带的
# Dockerfile 里有 `add-apt-repository ppa:openjdk-r/ppa` 然后 `apt update`，
# 而它的基础镜像 ghcr.io/kivy/buildozer 已经升到 Ubuntu 26.04（resolute），
# 该 PPA 没有 resolute 的 Release 文件 → 404 → apt 退出码 100 → 镜像构建失败
# → 整个 job 在跑到任何 step 之前就挂了（日志里能看到 "Docker build failed"）。
# 所以本文件 **不再使用任何第三方打包 Action**。
#
# 方案A（首选）：直接用官方镜像的文档标准用法
#     docker run -v "$PWD":/home/user/hostcwd kivy/buildozer:latest android debug
#   镜像内已装好 JDK 17 + autoconf/automake/libltdl-dev/ccache/cmake/unzip 等
#   全部依赖，runner 上一个 apt 包都不用装，环境与镜像完全解耦。
# 方案B（兜底）：万一容器路线挂了，就在 runner 上现装 buildozer 直接编译，
#   并复用方案A已经下好的 Android SDK / NDK。
#
# 中文字体（fonts/NotoSansSC-Regular.ttf，~200KB）已提交进仓库，
# 由 tools/subset_font.py 生成、GDI+ 逐字渲染验证过 —— 构建期不联网下载字体。

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  # p4a 装编译期依赖时不要交互提问（容器里没有 TTY，会卡住）
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  apk:
    name: 打包 APK
    # 固定 24.04：ubuntu-latest 会漂移，历史上已经因为镜像升级挂过一次
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查输入
        shell: bash
        run: |
          set -e
          for f in main.py buildozer.spec icon.png presplash.png fonts/NotoSansSC-Regular.ttf; do
            test -f "$f" || { echo "::error::缺少文件 $f"; exit 1; }
          done
          echo "字体 $(stat -c%s fonts/NotoSansSC-Regular.ttf) 字节"
          grep -n '^requirements' buildozer.spec
          grep -n 'accept_sdk_license' buildozer.spec

      # buildozer 要下 SDK + NDK + gradle 缓存，约 8-10GB
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
          df -h /

      - name: 准备缓存目录
        run: mkdir -p "$HOME/.buildozer" "$HOME/.gradle"

      # 只缓存「下载缓存」和 gradle 缓存 —— 都是幂等的，坏了也不会污染编译。
      # 注意：刻意不缓存 android-sdk / android-ndk（一旦存进半截的解压目录，
      # p4a 会以为 NDK 已就绪而跳过解压，后面链接必然失败）。
      # 怀疑缓存脏了就把 key 里的 bz1 递增一位。
      - name: 缓存下载
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/cache
            ~/.gradle
          key: bz1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 拉取构建镜像
        run: docker pull kivy/buildozer:latest

      # ── 方案A：官方 Docker 镜像 ─────────────────────────────────────
      - name: 打包 APK · 方案A（首次约 30-50 分钟）
        id: buildA
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -e PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE=0 \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$HOME/.gradle":/home/user/.gradle \
            kivy/buildozer:latest android debug 2>&1 | tee build-a.log
          echo "=== 方案A 日志末尾 ==="
          tail -30 build-a.log

      # ── 方案B：runner 本地 buildozer（仅当 A 失败）──────────────────
      - name: 方案B · 清理方案A留下的编译中间产物
        if: steps.buildA.outcome == 'failure'
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf bin
          # 保留已下载好的 android-sdk / android-ndk-*，其余（p4a 检出、build-*）全清，
          # 因为容器里的绝对路径是 /home/user/hostcwd，与 runner 的路径不一致。
          if [ -d .buildozer/android/platform ]; then
            for d in .buildozer/android/platform/*; do
              case "$(basename "$d")" in
                android-sdk|android-ndk-*) echo "保留 $d" ;;
                *) echo "清除 $d"; rm -rf "$d" ;;
              esac
            done
          fi
          ls -la .buildozer/android/platform 2>/dev/null || true

      - name: 方案B · 安装 JDK 与 Python
        if: steps.buildA.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 方案B · 安装 buildozer 及系统依赖
        if: steps.buildA.outcome == 'failure'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev ccache
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer "cython<3"
          java -version

      - name: 打包 APK · 方案B（首次约 30-50 分钟）
        if: steps.buildA.outcome == 'failure'
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-b.log
          echo "=== 方案B 日志末尾 ==="
          tail -30 build-b.log

      - name: 检查结果
        if: always()
        shell: bash
        run: |
          ls -la bin/ 2>/dev/null || echo "没有 bin 目录"
          ls bin/*.apk >/dev/null 2>&1 || { echo "::error::两条路线都没产出 APK，请看 build-a.log / build-b.log"; exit 1; }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaWuXing-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
